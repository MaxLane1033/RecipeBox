name: recipebox
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: recipebox
      POSTGRES_PASSWORD: recipebox
      POSTGRES_DB: recipebox
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipebox -d recipebox"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
